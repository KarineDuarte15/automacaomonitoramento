<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta http-equiv="refresh" content="60"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monitor de Automações</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#16202e;--mut:#667386;--line:#e0e5ec;--ok:#1b8a5a;--err:#c93b3b;--warn:#c98a12;--run:#2563c9;--nd:#8a94a3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 'IBM Plex Sans',system-ui,sans-serif}
header{background:#16202e;color:#fff;padding:14px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font-size:18px;margin:0;font-weight:600}.sub{color:#9fb0c6;font-size:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 12px;border-radius:6px;cursor:pointer}
button.p{background:#2563c9;color:#fff;border-color:#2563c9}button.g{background:#1b8a5a;color:#fff;border-color:#1b8a5a}button:hover{filter:brightness(.95)}
main{padding:20px 24px;max-width:1400px;margin:auto}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.k{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:8px;padding:12px 14px}
.k b{font-size:26px;display:block;line-height:1.1}.k span{color:var(--mut);font-size:12px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:12px;margin-bottom:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}.box h3{margin:0 0 8px;font-size:13px;color:var(--mut);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:12px}
.m{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:8px;padding:14px}
.m h2{font-size:15px;margin:0;display:flex;justify-content:space-between;gap:8px}
.chip{font-size:11px;font-weight:600;color:#fff;background:var(--c);border-radius:99px;padding:2px 10px;white-space:nowrap}
.pr{font-size:11px;color:var(--mut);margin:2px 0 8px}
.row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line);font-size:13px}.row:last-child{border:0}.row span:first-child{color:var(--mut)}
.msg{margin-top:8px;padding:8px 10px;border-radius:6px;background:#fbeaea;color:#8d2323;font-size:12.5px;word-break:break-word}
.msg.w{background:#fdf3de;color:#7a5200}.msg.i{background:#eaf1fc;color:#1d4a94}
.ok{--c:var(--ok)}.err{--c:var(--err)}.warn{--c:var(--warn)}.run{--c:var(--run)}.nd{--c:var(--nd)}
dialog{border:0;border-radius:10px;width:min(900px,95vw);max-height:90vh;padding:0}dialog::backdrop{background:#0008}
.dh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff}
.db{padding:14px 18px}fieldset{border:1px solid var(--line);border-radius:8px;margin:0 0 12px;padding:10px 12px}
legend{font-weight:600;padding:0 6px}label{display:block;font-size:12px;color:var(--mut)}
input[type=text],input[type=number]{width:100%;font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:5px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-bottom:8px}
.fo{background:#f7f9fb;border-radius:6px;padding:8px;margin-top:8px}
.hint{font-size:12px;color:var(--mut)}
@media(max-width:480px){.grid{grid-template-columns:1fr}.charts{grid-template-columns:1fr}}
</style></head><body>
<header>
<div><h1>Monitor de Automações</h1><div class="sub" id="last"></div></div>
<div class="bar"><button class="p" onclick="location.reload()">Atualizar agora</button><button class="g" id="bWa">Resumo no WhatsApp</button></div>
</header>
<main>
<div class="sum" id="sum"></div>
<div class="charts">
<div class="box"><h3>Tempo médio de execução por processo (min, mês atual)</h3><canvas id="c1" height="170"></canvas></div>
<div class="box"><h3>Execuções de hoje: sucesso e erro</h3><canvas id="c2" height="170"></canvas></div>
</div>
<div class="grid" id="grid"></div>
</main>
<dialog id="dWa"><div class="dh"><b>Resumo para WhatsApp</b><button id="bWc">Fechar</button></div><div class="db">
<p class="hint">Envio manual: abre o WhatsApp Web com a mensagem pronta. O envio automático é feito pelo Python a cada hora.</p>
<textarea id="waTxt" rows="12" style="width:100%;font:inherit;padding:8px"></textarea>
<div class="bar" id="waBtns" style="margin-top:10px"></div></div></dialog>

isos": [], "infos": [], "pastas": [], "quando": "21/10/2026 12:00:00", "linhas_hoje": null, "ok_hoje": null, "err_hoje": null, "media_min": null, "ultimo_fim": null}, {"nome": "BI Relatório de Consultas Disponibilizadas", "prio": "P1", "status": "nd", "erros": [], "avisos": [], "infos": [], "pastas": [], "quando": "21/10/2026 12:00:00", "linhas_hoje": null, "ok_hoje": null, "err_hoje": null, "media_min": null, "ultimo_fim": null}, {"nome": "BI Controle Agendas", "prio": "P1", "status": "nd", "erros": [], "avisos": [], "infos": [], "pastas": [], "quando": "21/10/2026 12:00:00", "linhas_hoje": null, "ok_hoje": null, "err_hoje": null, "media_min": null, "ultimo_fim": null}, {"nome": "BI Captação de Agendas", "prio": "P1", "status": "nd", "erros": [], "avisos": [], "infos": [], "pastas": [], "quando": "21/10/2026 12:00:00", "linhas_hoje": null, "ok_hoje": null, "err_hoje": null, "media_min": null, "ultimo_fim": null}, {"nome": "BI INDICADORES REDE CRED", "prio": "P1", "status": "nd", "erros": [], "avisos": [], "infos": [], "pastas": [], "quando": "21/10/2026 12:00:00", "linhas_hoje": null, "ok_hoje": null, "err_hoje": null, "media_min": null, "ultimo_fim": null}, {"nome": "Logs Projetos (Automações)", "prio": "P2", "status": "nd", "erros": [], "avisos": [], "infos": [], "pastas": [], "quando": "21/10/2026 12:00:00", "linhas_hoje": null, "ok_hoje": null, "err_hoje": null, "media_min": null, "ultimo_fim": null}, {"nome": "BI Relatório de Consultas em Transferência", "prio": "P2", "status": "nd", "erros": [], "avisos": [], "infos": [], "pastas": [], "quando": "21/10/2026 12:00:00", "linhas_hoje": null, "ok_hoje": null, "err_hoje": null, "media_min": null, "ultimo_fim": null}, {"nome": "BI Relatório de Cirurgias", "prio": "P2", "status": "nd", "erros": [], "avisos": [], "infos": [], "pastas": [], "quando": "21/10/2026 12:00:00", "linhas_hoje": null, "ok_hoje": null, "err_hoje": null, "media_min": null, "ultimo_fim": null}, {"nome": "BI Relatório Atraso dos Médicos", "prio": "P2", "status": "nd", "erros": [], "avisos": [], "infos": [], "pastas": [], "quando": "21/10/2026 12:00:00", "linhas_hoje": null, "ok_hoje": null, "err_hoje": null, "media_min": null, "ultimo_fim": null}, {"nome": "BI Relatório de Acompanhamento de Mensageria", "prio": "P2", "status": "nd", "erros": [], "avisos": [], "infos": [], "pastas": [], "quando": "21/10/2026 12:00:00", "linhas_hoje": null, "ok_hoje": null, "err_hoje": null, "media_min": null, "ultimo_fim": null}, {"nome": "BI Relatorio_SAC", "prio": "P2", "status": "nd", "erros": [], "avisos": [], "infos": [], "pastas": [], "quando": "21/10/2026 12:00:00", "linhas_hoje": null, "ok_hoje": null, "err_hoje": null, "media_min": null, "ultimo_fim": null}, {"nome": "CAPTADOS FORA DE ALERTA", "prio": "P2", "status": "nd", "erros": [], "avisos": [], "infos": [], "pastas": [], "quando": "21/10/2026 12:00:00", "linhas_hoje": null, "ok_hoje": null, "err_hoje": null, "media_min": null, "ultimo_fim": null}], "texto": "*Resumo do monitoramento* - 21/10/2026 12:00\n✅ OK: 5 | ⚠️ Alerta: 2 | ❌ Erro: 3\n\n❌ P0 BI Alerta Vagas v2\n   - FLUXO_PROC.py (11:15): 0 | Processo encerrado com código 1\n⚠️ P0 BI Alerta Vagas Tele Saúde\n   - Log com 5 linhas hoje; esperado 12 ou mais\n✅ P0 BI Necessidade de Compra\n✅ P1 T0012 - Disponibilidade / Marcada\n⚠️ P1 T22J2 - Consultas Disponibilizadas\n   - Nenhuma execução registrada hoje no log\n✅ P1 T22J3 - Base diária\n❌ P1 T9016 - Base mensal\n   - NÃO BAIXOU: T9016 tem 0 de 5 arquivos hoje\n✅ P1 Estoque e Abastecimento\n➖ P1 BI Painel dos Médicos\n➖ P1 BI Farol ICH (DGE)\n➖ P1 BI Relatório de Consultas Disponibilizadas\n➖ P1 BI Controle Agendas\n➖ P1 BI Captação de Agendas\n➖ P1 BI INDICADORES REDE CRED\n✅ P2 T9033 - Atraso Médico\n❌ P2 T9033 - Horas Médicos\n   - NÃO BAIXOU: HORAS MEDICOS tem 0 de 5 arquivos hoje\n➖ P2 Logs Projetos (Automações)\n➖ P2 BI Relatório de Consultas em Transferência\n➖ P2 BI Relatório de Cirurgias\n➖ P2 BI Relatório Atraso dos Médicos\n➖ P2 BI Relatório de A const L={ok:'OK',err:'ERRO',warn:'ALERTA',run:'RODANDO',nd:'SEM CONFIG'};
$('#last').textContent='Último monitoramento: '+D.gerado+' | o Python verifica a cada '+D.intervalo+' min | a página se atualiza sozinha';
const c={ok:0,err:0,warn:0,run:0};D.r.forEach(r=>{if(c[r.status]!=null)c[r.status]++});
$('#sum').innerHTML=[['Processos',D.r.length,'#16202e'],['OK',c.ok,'var(--ok)'],['Rodando',c.run,'var(--run)'],['Alertas',c.warn,'var(--warn)'],['Com erro',c.err,'var(--err)']].map(([a,b,col])=>`<div class="k" style="--c:${col}"><b>${b}</b><span>${a}</span></div>`).join('');
$('#grid').innerHTML=[...D.r].sort((a,b)=>a.prio.localeCompare(b.prio)).map(r=>{const w=[];
if(r.linhas_hoje!=null)w.push(['Execuções hoje',`${r.linhas_hoje} (${r.ok_hoje} ok / ${r.err_hoje} erro)`],['Último fim',r.ultimo_fim],['Tempo médio (mês)',r.media_min==null?'-':r.media_min.toFixed(1)+' min']);

w.push(['Verificado em',r.quando]);
return `<div class="m ${r.status}"><h2><span>${r.nome}</span><span class="chip">${L[r.status]}</span></h2><div class="pr">Prioridade ${r.prio}</div>${w.map(x=>`<div class="row"><span>${x[0]}</span><span>${x[1]}</span></div>`).join('')}${r.erros.map(x=>`<div class="msg">${x}</div>`).join('')}${r.avisos.map(x=>`<div class="msg w">${x}</div>`).join('')}${r.infos.map(x=>`<div class="msg i">${x}</div>`).join('')}</div>`}).join('');

new Chart($('#c2'),{type:'bar',data:{labels:tl.map(r=>r.nome),datasets:[{label:'Sucesso',data:tl.map(r=>r.ok_hoje),backgroundColor:'#1b8a5a'},{label:'Erro',data:tl.map(r=>r.err_hoje),backgroundColor:'#c93b3b'}]},options:{indexAxis:'y',scales:{x:{stacked:true},y:{stacked:true}},animation:false}});
$('#bWa').onclick=()=>{$('#waTxt').value=D.texto;const lk=p=>`https://web.whatsapp.com/send?phone=${p.numero}&text=${encodeURIComponent($('#waTxt').value)}`;
$('#waBtns').innerHTML=D.destinos.map((p,i)=>`<button class="g" data-i="${i}">Abrir conversa: ${p.nome}</button>`).join('')+'<button id="bCp">Copiar texto</button>';
